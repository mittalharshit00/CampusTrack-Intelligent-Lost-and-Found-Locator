spring.application.name=backend
server.port=${SERVER_PORT:8082}

# Database Configuration
# Local development defaults to embedded H2 so `mvn spring-boot:run` works without a MySQL install.
# Docker / production can override these values via DB_* environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:mem:campus_lf;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=MnQ59ri26W1QxqG/evei/m50F/tjJQEpKAviaCjhjqo=
app.jwt.expiration-ms=86400000

# Enable debug logging for security and application
logging.level.org.springframework.security=DEBUG
logging.level.com.campuslfp=DEBUG
